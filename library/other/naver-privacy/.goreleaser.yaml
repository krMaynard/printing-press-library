version: 2
project_name: naver-privacy-pp-cli
changelog:
  disable: true
builds:
  - id: naver-privacy-pp-cli
    main: ./cmd/naver-privacy-pp-cli
    binary: naver-privacy-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X naver-privacy-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: naver-privacy-pp-mcp
    main: ./cmd/naver-privacy-pp-mcp
    binary: naver-privacy-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: naver-privacy-pp-cli
    repository:
      owner: krmaynard
      name: homebrew-tap
    homepage: "https://github.com/krmaynard/naver-privacy-pp-cli"
    description: "Naver's transparency-report series — Korea's first, published since 2015 — as tidy per-category statistics instead of a CMS page blob."
    install: |
      bin.install "naver-privacy-pp-cli"
      bin.install "naver-privacy-pp-mcp"
